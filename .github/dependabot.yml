version: 2

# Weekly dependency updates. Minor/patch bumps are grouped into a single PR per ecosystem so routine
# maintenance stays one review, while major bumps arrive on their own (they need a real look).
updates:
  - package-ecosystem: npm
    directory: /fire-academy-frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: /fire-academy-backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      backend-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"

  # Base images for both containers (Dockerfile FROM lines).
  - package-ecosystem: docker
    directories:
      - /fire-academy-backend
      - /fire-academy-frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(docker)"
