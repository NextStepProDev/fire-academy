name: CI Frontend

on:
  push:
    branches: [main]
    paths:
      - fire-academy-frontend/**
      - VERSION
  pull_request:
    branches: [main]
    paths:
      - fire-academy-frontend/**
      - VERSION

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fire-academy-frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fire-academy-frontend/package-lock.json
      - run: npm ci
      # Two steps on purpose. The report always prints the full advisory list so a new "high" is visible
      # in the log; the gate only fails the build on "critical". Reason for the gap: GHSA-qwww-vcr4-c8h2
      # (react-router, high) has no fix inside the 7.x line — npm's only remedies are a downgrade to
      # 7.11.0 or the 8.x major, and the advisory covers React Router's RSC mode, which this SPA does not
      # use. Blocking on "high" today would just mean a permanently red build. Tighten this to
      # `--audit-level=high` once the React Router 8 upgrade lands.
      - name: Report dependency advisories
        run: npm audit || true
      - name: Fail on critical advisories
        run: npm audit --audit-level=critical
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      - run: npm run build

  docker:
    needs: lint-typecheck-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/fire-academy-frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6
        with:
          context: fire-academy-frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Skan CVE w warstwie systemowej obrazu (czego npm audit nie widzi).
      # Informacyjnie na razie (exit-code 0 = nie blokuje deployu). ignore-unfixed
      # ucina szum z podatności bez łatki; zostają te naprawialne bumpem bazy.
      # Gdy wyniki będą czyste, ustaw exit-code na 1, by high/critical wywalały build.
      - name: Trivy image scan (high+)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # Nazwa obrazu musi być lowercase (owner NextStepProDev ma wielkie litery,
          # a OCI reference wymaga małych — metadata-action lowercase'uje sam przy pushu).
          image-ref: ghcr.io/nextstepprodev/fire-academy-frontend:${{ steps.version.outputs.version }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
