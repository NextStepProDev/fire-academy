name: CI Frontend

on:
  push:
    branches: [main]
    paths:
      - fire-academy-frontend/**
      - VERSION
  pull_request:
    branches: [main]
    paths:
      - fire-academy-frontend/**
      - VERSION

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fire-academy-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fire-academy-frontend/package-lock.json
      - run: npm ci
      # Two steps on purpose. The report always prints the full advisory list so a new "high" is visible
      # in the log; the gate only fails the build on "critical". Reason for the gap: GHSA-qwww-vcr4-c8h2
      # (react-router, high) has no fix inside the 7.x line — npm's only remedies are a downgrade to
      # 7.11.0 or the 8.x major, and the advisory covers React Router's RSC mode, which this SPA does not
      # use. Blocking on "high" today would just mean a permanently red build. Tighten this to
      # `--audit-level=high` once the React Router 8 upgrade lands.
      - name: Report dependency advisories
        run: npm audit || true
      - name: Fail on critical advisories
        run: npm audit --audit-level=critical
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      # The end-to-end suite used to be local-only, and drifted red without anyone noticing: three of
      # its checks asserted routes and markup that had changed months earlier. A suite nobody runs is
      # not a safety net, it is a file. It costs ~1 min here (one browser, API stubbed, no backend).
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E golden path
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: fire-academy-frontend/playwright-report/
          retention-days: 7
      - run: npm run build

  docker:
    needs: lint-typecheck-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/fire-academy-frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v7
        with:
          context: fire-academy-frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Image CVE scan, and it now FAILS the build. It sat at exit-code 0 for months with a comment
      # saying "flip this to 1 once the results are clean" — which is a scan nobody reads, written
      # into a log nobody opens. ignore-unfixed keeps the noise out: what is left is fixable by
      # bumping the base image. This job runs only on merges to main and does not gate deploy.yml,
      # so the cost of a finding is a red build asking for a base bump, not a blocked release.
      # If it turns out to be too noisy in practice, narrow `severity` rather than going back to 0.
      - name: Trivy image scan (high+)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # Nazwa obrazu musi być lowercase (owner NextStepProDev ma wielkie litery,
          # a OCI reference wymaga małych — metadata-action lowercase'uje sam przy pushu).
          image-ref: ghcr.io/nextstepprodev/fire-academy-frontend:${{ steps.version.outputs.version }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
