name: CI Frontend

on:
  push:
    branches: [main]
    paths:
      - fire-academy-frontend/**
      - VERSION
  pull_request:
    branches: [main]
    paths:
      - fire-academy-frontend/**
      - VERSION

  # Re-scan what is already published. A build-time scan is only ever as fresh as the day it
  # ran: these three CRITICAL Tomcat advisories were published into Trivy's database AFTER
  # the last merge, so CI stayed green because it never ran again, not because it passed.
  # Monday 06:00 UTC, ahead of Dependabot's Monday run so a fix lands the same morning.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  # Required by github/codeql-action/upload-sarif so Trivy findings land in the Security tab.
  security-events: write

jobs:
  lint-typecheck-build:
    # The scheduled run re-scans a published image; it does not rebuild or retest.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fire-academy-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fire-academy-frontend/package-lock.json
      - run: npm ci
      # Two steps on purpose. The report always prints the full advisory list so a new "high" is visible
      # in the log; the gate only fails the build on "critical". Reason for the gap: GHSA-qwww-vcr4-c8h2
      # (react-router, high) has no fix inside the 7.x line — npm's only remedies are a downgrade to
      # 7.11.0 or the 8.x major, and the advisory covers React Router's RSC mode, which this SPA does not
      # use. Blocking on "high" today would just mean a permanently red build. Tighten this to
      # `--audit-level=high` once the React Router 8 upgrade lands.
      - name: Report dependency advisories
        run: npm audit || true
      - name: Fail on critical advisories
        run: npm audit --audit-level=critical
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
      # The end-to-end suite used to be local-only, and drifted red without anyone noticing: three of
      # its checks asserted routes and markup that had changed months earlier. A suite nobody runs is
      # not a safety net, it is a file. It costs ~1 min here (one browser, API stubbed, no backend).
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E golden path
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: fire-academy-frontend/playwright-report/
          retention-days: 7
      - run: npm run build

  docker:
    needs: lint-typecheck-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/fire-academy-frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v7
        with:
          context: fire-academy-frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The scan produces a REPORT and a GATE, deliberately as two steps.
      #
      # The report (SARIF) never fails the build: its job is to put every HIGH and CRITICAL into the
      # Security tab, where a finding outlives the run that produced it. `format: table` wrote them
      # into the log of a build that then went green, and a finding that exists only inside a passing
      # build's log is a finding nobody reads. Three CRITICAL Tomcat auth-bypass advisories
      # (CVE-2026-65182 / -65905 / -68525) reached production that way.
      #
      # The gate fails on CRITICAL only — not HIGH. The Alpine layer carries a HIGH or two (curl,
      # openssl) at any given moment, unrelated to our code and fixed on Alpine's release rhythm
      # rather than ours; a gate that goes red on somebody else's schedule gets switched off within
      # a month, and then nothing gates anything. Measured before this landed: backend CRITICAL 0
      # (after the 11.0.25 bump), frontend CRITICAL 0 — green from day one.
      - name: Trivy report (SARIF, never fails)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # Nazwa obrazu musi być lowercase (owner NextStepProDev ma wielkie litery,
          # a OCI reference wymaga małych — metadata-action lowercase'uje sam przy pushu).
          image-ref: ghcr.io/nextstepprodev/fire-academy-frontend:${{ steps.version.outputs.version }}
          format: sarif
          output: trivy-frontend.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      # if: always() so the report still arrives when the gate below fails — the run where the gate
      # fires is exactly the run whose findings somebody needs to read.
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

      - name: Trivy gate (CRITICAL fails the build)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/nextstepprodev/fire-academy-frontend:${{ steps.version.outputs.version }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  # Same report+gate as the docker job, pointed at the image already in the registry rather than
  # one just built. This is the job that would have caught the Tomcat advisories: it re-asks the
  # question every week against a fresh vulnerability database, with no commit required.
  scheduled-image-scan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Trivy report (SARIF, never fails)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/nextstepprodev/fire-academy-frontend:${{ steps.version.outputs.version }}
          format: sarif
          output: trivy-frontend.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend
      - name: Trivy gate (CRITICAL fails the build)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/nextstepprodev/fire-academy-frontend:${{ steps.version.outputs.version }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
