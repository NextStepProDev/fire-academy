plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'pl.fireacademy'
version = (() -> {
    def versionFile = file("../VERSION")
    if (versionFile.exists()) {
        return versionFile.text.trim()
    }
    return System.getenv("APP_VERSION") ?: "dev"
})()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Overrides of versions Spring Boot's BOM manages for us. Each one needs a reason and a way out —
// a pin nobody remembers is how a project ends up older than the platform it sits on.
ext {
    // CVE-2026-54291: pgjdbc could be talked out of SCRAM-SHA-256-PLUS down to plain SCRAM, which
    // drops the channel binding that ties authentication to the TLS connection. Our database is
    // reachable only from inside the compose network, so the man in the middle would already have to
    // be inside it — but this is a one-digit bump and the CVE gate is right to refuse the image.
    // REMOVE once Spring Boot's BOM manages 42.7.12 or later; the pin is then just a way to fall behind.
    set('postgresql.version', '42.7.12')
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'

    implementation 'org.jspecify:jspecify:1.0.1'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'

    implementation 'net.coobird:thumbnailator:0.4.21'

    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:postgresql:1.21.4'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
}

tasks.named('bootRun') {
    doFirst {
        def envFile = file('.env')
        if (envFile.exists()) {
            envFile.readLines().each { line ->
                def trimmed = line.trim()
                if (trimmed && !trimmed.startsWith('#')) {
                    def parts = trimmed.split('=', 2)
                    if (parts.length == 2) {
                        environment parts[0].trim(), parts[1].trim()
                    }
                }
            }
        }
    }
}

tasks.named('processResources') {
    filesMatching('application*.yml') {
        filter { line ->
            line.replace('@version@', project.version.toString())
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = false
        html.required = true
    }
}

jacoco {
    toolVersion = '0.8.13'
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                minimum = 0.60
            }
        }
    }
}

tasks.named('check') {
    dependsOn jacocoTestCoverageVerification
}

tasks.withType(JavaCompile) {
    options.compilerArgs << '-parameters'
}
