# Every X-Forwarded-* header the backend reads is set HERE, from nginx's own variables, and never
# passed through from the client. nginx only replaces the headers it names: anything else a caller
# invents arrives at the backend untouched, and the backend runs with
# forward-headers-strategy: framework, so it BELIEVES them when it builds absolute URLs. That is how
# X-Forwarded-Host slipped through — Spring's OAuth redirect_uri is derived from it, so a request
# header could bend the address Google is told to send the user back to. Same reasoning for
# X-Forwarded-Proto, which used to be echoed from $http_x_forwarded_proto (i.e. from the caller):
# Cloudflare reaches the origin over 443, so $scheme is the honest answer and the client's opinion
# is not needed. Adding a location that proxies to the backend means adding these headers to it.
#
# Real client IP for the backend rate limiter. Trust Cloudflare's CF-Connecting-IP,
# fall back to the direct peer. Critically, we OVERWRITE X-Forwarded-For with a single
# trusted value instead of appending ($proxy_add_x_forwarded_for) — appending keeps any
# client-supplied X-Forwarded-For as the first token, which the backend reads, letting an
# attacker rotate it to bypass the per-IP login limiter. (Origin should also be firewalled
# to Cloudflare IP ranges so CF-Connecting-IP cannot be spoofed by hitting the origin directly.)
map $http_cf_connecting_ip $real_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# HTTP → HTTPS redirect (Cloudflare hits origin on 443; this is a safety net)
server {
    listen 80;
    server_name fireworkout.pl www.fireworkout.pl _;
    return 301 https://fireworkout.pl$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name fireworkout.pl www.fireworkout.pl _;

    # Cloudflare Origin Certificate (mounted from host)
    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1h;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 15m;

    # Security headers
    # X-XSS-Protection is deliberately absent: the header is retired from the standard, ignored by
    # every current browser, and its legacy filter caused bugs of its own. CSP below is the control.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # The two YouTube hosts are what the exercise-video library actually loads, and nothing wider:
    # posters come from img.youtube.com (which redirects to i.ytimg.com), the player is an iframe on
    # youtube-nocookie.com built from the parsed video id (see YouTubeUrl). frame-src must be spelled
    # out — without it iframes fall back to default-src 'self' and the player silently renders blank.
    # This only bites in production: the Vite dev server sends no CSP at all.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://img.youtube.com https://i.ytimg.com; font-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml;
    gzip_min_length 256;

    # Static assets with long cache (Vite hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Images, fonts, favicon — cache 30 days
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # www → non-www redirect
    if ($host = www.fireworkout.pl) {
        return 301 https://fireworkout.pl$request_uri;
    }

    # Uploaded files proxy — browser cache 7d, nginx buffers response.
    # ^~ so the image-extension regex location below does NOT intercept
    # /api/files/*.jpg|png|... (regex locations otherwise win over this prefix).
    location ^~ /api/files/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $real_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 4 32k;
    }

    # OG proxy for social/link-preview crawlers on detail pages.
    # Do NOT add search crawlers (Googlebot/bingbot/Baidu/Yandex) here: the /og/
    # stub uses meta-refresh back to the same URL, which a JS-rendering search bot
    # follows in a loop -> GSC "Redirect error". Search crawlers must hit the SPA.
    location ~ ^/kadra/[0-9a-f-]+$ {
        if ($http_user_agent ~* "(facebookexternalhit|Facebot|WhatsApp|Twitterbot|LinkedInBot|Slackbot|TelegramBot|Discordbot)") {
            rewrite ^/(.*)$ /og/$1 break;
            proxy_pass http://backend:8081;
        }
        # Set on the location, not inside the `if`: nginx forbids proxy_set_header there, and the
        # proxy_pass above still picks these up. Harmless on the try_files path below.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $real_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # no-cache the SPA shell so a deep-link entry point can't pin a stale
        # index.html pointing at hashed chunks deleted by a later deploy.
        # `expires -1` (not add_header) keeps the inherited server-level security headers.
        expires -1;
        try_files $uri /index.html;
    }

    location ~ ^/(treningi|obozy|szkolenia)/(rodzaj|termin)/[0-9a-f-]+$ {
        if ($http_user_agent ~* "(facebookexternalhit|Facebot|WhatsApp|Twitterbot|LinkedInBot|Slackbot|TelegramBot|Discordbot)") {
            rewrite ^/(.*)$ /og/$1 break;
            proxy_pass http://backend:8081;
        }
        # Set on the location, not inside the `if`: nginx forbids proxy_set_header there, and the
        # proxy_pass above still picks these up. Harmless on the try_files path below.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $real_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # See note above: no-cache the shell without dropping security headers.
        expires -1;
        try_files $uri /index.html;
    }

    # OG endpoint proxy
    location /og/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $real_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # API proxy
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $real_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 4 16k;
    }

    # OAuth2 proxy
    location /oauth2/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $real_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Login OAuth2 proxy
    location /login/oauth2/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $real_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Sitemap proxy
    location = /sitemap.xml {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $real_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # SPA fallback — cache index.html briefly to avoid re-fetches
    location / {
        # Serve prerendered flat files (e.g. /treningi -> /treningi.html) directly
        # with no trailing-slash redirect, so the served URL matches canonical exactly.
        try_files $uri $uri.html $uri/ /index.html;
        # no-cache so a new deploy's index.html is always re-fetched (hashed chunks
        # change every build). `expires -1` emits Cache-Control: no-cache WITHOUT the
        # add_header inheritance rule that would otherwise drop the server-level
        # security headers (CSP, X-Frame-Options, HSTS) from these HTML responses.
        expires -1;
    }
}
